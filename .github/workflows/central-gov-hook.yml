name: Central Governance

on:
  pull_request:

permissions:
  contents: read

jobs:
  central-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Capture changed paths
        shell: bash
        run: |
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            > "$RUNNER_TEMP/central-gov-changed-files.txt"

      - name: Run base-controlled central governance checks
        shell: bash
        run: |
          checker_path="00_Governance/01_Central/03_Tooling/central_gov_checks.py"
          trusted_checker="$RUNNER_TEMP/central_gov_checks.py"
          git show "${{ github.event.pull_request.base.sha }}:$checker_path" > "$trusted_checker"

          beta_exists=false
          beta_sha=""
          beta_ref="refs/heads/beta"
          if beta_line="$(git ls-remote --exit-code --heads origin "$beta_ref")"; then
            beta_before="${beta_line%%[[:space:]]*}"
            git fetch --no-tags origin "+$beta_ref:refs/remotes/origin/beta"
            beta_fetched="$(git rev-parse --verify refs/remotes/origin/beta)"
            beta_line="$(git ls-remote --exit-code --heads origin "$beta_ref")"
            beta_after="${beta_line%%[[:space:]]*}"
            if [[ "$beta_before" != "$beta_fetched" || "$beta_fetched" != "$beta_after" ]]; then
              echo "Persistent beta identity changed while the governance check was acquiring evidence." >&2
              exit 1
            fi
            beta_exists=true
            beta_sha="$beta_fetched"
          fi

          python "$trusted_checker" \
            --repository "${{ github.repository }}" \
            --head "${{ github.head_ref }}" \
            --head-repository "${{ github.event.pull_request.head.repo.full_name }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --base "${{ github.base_ref }}" \
            --beta-exists "$beta_exists" \
            --beta-sha "$beta_sha" \
            --changed-files-file "$RUNNER_TEMP/central-gov-changed-files.txt"
