# **Version:** v1.3.0
# **Status:** Approved
# **Approval tag:** `central-gov-hook-v1.3.0`
# **Approval date:** 2026-10-21

name: Central Governance

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  central-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default-branch workflow source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Capture exact pull-request candidate as untrusted data
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid pull-request number in trusted event payload." >&2
            exit 1
          fi
          for commit_sha in "$BASE_SHA" "$HEAD_SHA" "$TRUSTED_WORKFLOW_SHA"; do
            if [[ ! "$commit_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Invalid immutable commit identity in trusted event payload." >&2
              exit 1
            fi
          done
          if [[ "$(git rev-parse HEAD)" != "$TRUSTED_WORKFLOW_SHA" ]]; then
            echo "Trusted workflow checkout does not match github.workflow_sha." >&2
            exit 1
          fi

          git fetch --no-tags origin \
            "+refs/heads/$BASE_REF:refs/remotes/origin/governance-pr-base"
          git fetch --no-tags origin \
            "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/governance-pr-head"
          fetched_head="$(git rev-parse --verify refs/remotes/origin/governance-pr-head)"
          if [[ "$fetched_head" != "$HEAD_SHA" ]]; then
            echo "Fetched pull-request head does not match the trusted event identity." >&2
            exit 1
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}"; then
            echo "Trusted pull-request base commit is unavailable." >&2
            exit 1
          fi

          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" \
            > "$RUNNER_TEMP/central-gov-changed-files.bin"
          git ls-tree -r --name-only -z "$HEAD_SHA" \
            > "$RUNNER_TEMP/central-gov-candidate-files.bin"

      - name: Run trusted routing-only central governance checks
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          checker_path="00_Governance/01_Central/03_Tooling/central_gov_checks.py"
          if [[ ! -f "$checker_path" ]]; then
            echo "Trusted default-branch routing checker is unavailable." >&2
            exit 1
          fi

          beta_exists=false
          beta_sha=""
          beta_ref="refs/heads/beta"
          if beta_line="$(git ls-remote --exit-code --heads origin "$beta_ref")"; then
            beta_before="${beta_line%%[[:space:]]*}"
            git fetch --no-tags origin "+$beta_ref:refs/remotes/origin/beta"
            beta_fetched="$(git rev-parse --verify refs/remotes/origin/beta)"
            beta_line="$(git ls-remote --exit-code --heads origin "$beta_ref")"
            beta_after="${beta_line%%[[:space:]]*}"
            if [[ "$beta_before" != "$beta_fetched" || "$beta_fetched" != "$beta_after" ]]; then
              echo "Persistent beta identity changed while the governance check was acquiring evidence." >&2
              exit 1
            fi
            beta_exists=true
            beta_sha="$beta_fetched"
          fi

          python "$checker_path" \
            --repository "$REPOSITORY" \
            --head "$HEAD_REF" \
            --head-repository "$HEAD_REPOSITORY" \
            --head-sha "$HEAD_SHA" \
            --base "$BASE_REF" \
            --beta-exists "$beta_exists" \
            --beta-sha "$beta_sha" \
            --changed-files-file "$RUNNER_TEMP/central-gov-changed-files.bin" \
            --repository-files-file "$RUNNER_TEMP/central-gov-candidate-files.bin"
