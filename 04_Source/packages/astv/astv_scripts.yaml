# ============================================================================
# ASTV Protected Scripts
#
# These scripts are stored as a package because they contain !include
# statements. They must not be recreated in the Home Assistant Script UI,
# otherwise the UI will overwrite the includes.
# ============================================================================

script:
  astv_find_tag_record:
    alias: 'ASTV - Fn: Find Tag Record'
    description: Returns the tag-mapping record matching a scanned UID
    mode: parallel
    max: 10
    fields:
      uid:
        name: UID
        description: Scanned NFC UID
        required: true
        selector:
          text:
    sequence:
    - variables:
        tag_mapping: !include ../../assistive/astv_tag_mapping.yaml
        lookup_uid: '{{ uid | string | trim | upper }}'
    - variables:
        tag_record_response: '{{ tag_mapping.get(lookup_uid, {}) }}'
    - stop: Tag lookup complete
      response_variable: tag_record_response

  astv_find_intent_record:
    alias: 'ASTV - Fn: Find Intent Record'
    description: Returns the intent-catalogue record matching an intent ID
    mode: parallel
    max: 10
    fields:
      intent_id:
        name: Intent ID
        description: Canonical ASTV intent ID
        required: true
        selector:
          text:
    sequence:
    - variables:
        intent_catalogue: !include ../../assistive/astv_intent_catalogue.yaml
        lookup_intent_id: '{{ intent_id | string | trim | lower }}'
    - variables:
        intent_record_response: '{{ intent_catalogue.get(lookup_intent_id, {}) }}'
    - stop: Intent lookup complete
      response_variable: intent_record_response

  astv_find_area_domain_endpoints:
    alias: 'ASTV - Fn: Find Area Domain Endpoints'
    description: Returns the endpoints for the provided domain within the provided area
    mode: parallel
    max: 10
    fields:
      domain:
        selector:
          text: null
        name: Domain
        required: true
      area:
        selector:
          area:
        name: Area
    sequence:
    - variables:
        endpoints: !include ../../assistive/astv_area_endpoints2.yaml
    - variables:
        area_domain_response: "{{\n  endpoints\n  .get(area, {})\n  .get('playback',\n          {})\n  .get(domain, {})\n}}"
    - stop: Area playback domain endpoints found
      response_variable: area_domain_response
