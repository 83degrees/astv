# ============================================================================
# ASTV Protected Scripts
#
# These scripts are stored as a package because they contain !include
# statements. They must not be recreated in the Home Assistant Script UI,
# otherwise the UI will overwrite the includes.
# ============================================================================

script:
  astv_find_tag_record:
    alias: 'ASTV - Fn: Find Tag Record'
    description: Returns the tag-mapping record matching a scanned UID
    mode: parallel
    max: 10
    fields:
      uid:
        name: UID
        description: Scanned NFC UID
        required: true
        selector:
          text:
    sequence:
    - variables:
        tag_mapping: !include ../../assistive/astv_tag_mapping.yaml
        lookup_uid: '{{ uid | string | trim | upper }}'
    - variables:
        tag_record_response: '{{ tag_mapping.get(lookup_uid, {}) }}'
    - stop: Tag lookup complete
      response_variable: tag_record_response

  astv_find_intent_record:
    alias: 'ASTV - Fn: Find Intent Record'
    description: Returns the intent-catalogue record matching an intent ID
    mode: parallel
    max: 10
    fields:
      intent_id:
        name: Intent ID
        description: Canonical ASTV intent ID
        required: true
        selector:
          text:
    sequence:
    - variables:
        intent_catalogue: !include ../../assistive/astv_intent_catalogue.yaml
        lookup_intent_id: '{{ intent_id | string | trim | lower }}'
    - variables:
        intent_record_response: '{{ intent_catalogue.get(lookup_intent_id, {}) }}'
    - stop: Intent lookup complete
      response_variable: intent_record_response

  astv_find_area_domain_endpoints:
    alias: 'ASTV - Fn: Find Area Domain Endpoints'
    description: Returns the endpoints for the provided domain within the provided area
    mode: parallel
    max: 10
    fields:
      domain:
        selector:
          text: null
        name: Domain
        required: true
      area:
        selector:
          area:
        name: Area
    sequence:
    - variables:
        endpoints: !include ../../assistive/astv_area_endpoints2.yaml
    - variables:
        area_domain_response: "{{\n  endpoints\n  .get(area, {})\n  .get('playback',\n          {})\n  .get(domain, {})\n}}"
    - stop: Area playback domain endpoints found
      response_variable: area_domain_response

  # Migrated from common /config/scripts.yaml
  astv_select_intent_engine:
    alias: ASTV - Select Intent Engine
    description: Selects one Phase 2 intent engine, which owns preparation and execution
      dispatch for its intent family.
    fields:
      intent_record:
        selector:
          object:
        name: Intent Record
        required: true
        description: The resolved ASTV intent record.
      target_area:
        selector:
          text:
        name: Target Area
        required: true
        description: The area resolved for this ASTV request.
    sequence:
    - variables:
        intent: '{{ intent_record.intent }}'
        intent_path: '{{ intent.split(''.'') }}'
    - alias: Choose Intent Engine based on intent_path
      choose:
      - conditions:
        - condition: template
          value_template: '{{ intent_path[0] == ''media'' }}'
        sequence:
        - action: script.astv_intent_engine_media
          metadata: {}
          data:
            intent_record: '{{ intent_record }}'
            target_area: '{{ target_area }}'
        alias: Media.*
      - conditions:
        - condition: template
          value_template: '{{ intent_path[0] == ''routine'' }}'
        sequence:
        - action: script.astv_intent_engine_routine
          metadata: {}
          data:
            intent_record: '{{ intent_record }}'
            target_area: '{{ target_area }}'
        alias: Routine.*
      default:
      - action: notify.persistent_notification
        metadata: {}
        data:
          message: 'No intent recognised for:


            Title: {{ intent_record.title }}

            Intent: {{ intent }}

            Intent Path: {{ intent_path }}'
          title: Intent not recognised
      - stop: Intent not recognised
        error: true
    mode: parallel
    max: 10
  astv_uid_gateway:
    alias: ASTV - UID Gateway
    description: ''
    fields:
      uid:
        selector:
          text:
        name: UID
        required: true
        description: Received UID
      trigger_entity:
        selector:
          entity:
        default: sensor.pi_nfc_99_last_uid
        name: Trigger Entity
    sequence:
    - action: script.astv_find_tag_record
      data:
        uid: '{{ uid }}'
      response_variable: tag_record_response
    - if:
      - condition: template
        value_template: '{{ tag_record_response | default({}, true) | count == 0 }}'
      then:
      - action: persistent_notification.create
        data:
          title: No Tag Record Found
          message: 'No tag record found for UID:

            {{ uid }}'
      - stop: No tag record found
        error: false
    - if:
      - condition: template
        value_template: '{{ tag_record_response.intent_id | default('''', true) | string
          | trim == '''' }}'
      then:
      - action: persistent_notification.create
        data:
          title: Invalid Tag Record
          message: 'Tag record for UID ''{{ uid }}'' has no valid intent_id.


            Record: {{ tag_record_response }}'
      - stop: Invalid tag record
        error: false
    - variables:
        tag_intent_id: '{{ tag_record_response.intent_id | string | trim }}'
        tag_area_override: '{{ tag_record_response.area_override | default('''', true)
          | string | trim }}'
    - action: persistent_notification.create
      data:
        title: Tag Record Found
        message: 'UID: {{ uid }}

          Trigger Entity: {{ trigger_entity }}

          Intent ID: {{ tag_intent_id }}

          Area Override: {{ tag_area_override if tag_area_override != '''' else ''(none)''
          }}'
    - action: script.astv_intent_gateway
      data:
        intent_id: '{{ tag_intent_id }}'
        input_area_override: '{{ tag_area_override }}'
        trigger_entity: '{{ trigger_entity }}'
    mode: parallel
    max: 10
  astv_intent_engine_media:
    alias: 'ASTV - Intent Engine: Media'
    description: Resolves Media execution details through the normalized MediaCat path
      and dispatches the complete execution context.
    fields:
      intent_record:
        selector:
          object:
        name: Intent Record
        required: true
        description: The resolved ASTV intent record.
      target_area:
        selector:
          text:
        name: Target Area
        required: true
        description: The area resolved for this ASTV request.
    sequence:
    - variables:
        catalogue_id: '{{ intent_record.params.catalogue_id | default('''', true) | string
          | trim }}'
        item_id: '{{ intent_record.params.item_id | default('''', true) | string | trim }}'
    - alias: Validate normalized MediaCat reference
      choose:
      - alias: Incomplete MediaCat reference
        conditions:
        - condition: template
          value_template: '{{ (catalogue_id != '''') != (item_id != '''') }}'
        sequence:
        - action: persistent_notification.create
          data:
            title: Incomplete MediaCat Reference
            message: 'Media intent ''{{ intent_record.title | default(''(untitled)'', true)
              }}'' supplied an incomplete MediaCat reference.


              catalogue_id: {{ catalogue_id if catalogue_id != '''' else ''(blank)''
              }}

              item_id: {{ item_id if item_id != '''' else ''(blank)'' }}'
        - stop: Incomplete MediaCat reference
          error: true
      - alias: Missing MediaCat reference
        conditions:
        - condition: template
          value_template: '{{ catalogue_id == '''' and item_id == '''' }}'
        sequence:
        - action: persistent_notification.create
          data:
            title: Missing MediaCat Reference
            message: 'Media intent ''{{ intent_record.title | default(''(untitled)'', true) }}'' supplied no MediaCat catalogue_id/item_id.'
        - stop: Missing MediaCat reference
          error: true
    - action: curated_media.resolve_media_record
      data:
        catalogue_id: '{{ catalogue_id }}'
        item_id: '{{ item_id }}'
      response_variable: media_record_response
    - action: script.astv_find_area_domain_endpoints
      metadata: {}
      data:
        domain: '{{ intent_record.params.output.domain }}'
        area: '{{ target_area }}'
      response_variable: area_domain_response
    - action: script.astv_resolve_playback_method
      metadata: {}
      data:
        preferences: '{{ area_domain_response.preference }}'
        available_sources: '{{ media_record_response.execution_methods }}'
      response_variable: playback_method_response
    - action: script.astv_select_area_playback_endpoint
      metadata: {}
      data:
        area_playback_domain: '{{ area_domain_response }}'
        playback_method: '{{ playback_method_response.selected_source }}'
      response_variable: area_playback_endpoint_response
    - variables:
        execution_method: '{{ area_playback_endpoint_response.keys() | first | default('''',
          true) }}'
        selected_endpoint: '{{ area_playback_endpoint_response.get(area_playback_endpoint_response.keys()
          | first, {}) }}'
    - action: script.astv_select_execution_engine
      data:
        intent_context:
          record: '{{ intent_record }}'
          data:
            media_record: '{{ media_record_response }}'
        target_context:
          area: '{{ target_area }}'
          endpoint: '{{ selected_endpoint }}'
        execution_context:
          engine: '{{ execution_method }}'
    mode: parallel
    max: 10
  astv_resolve_area:
    alias: 'ASTV - Fn: Resolve Area'
    description: ''
    fields:
      input_area_override:
        selector:
          text:
        name: Input Area Override
        description: Optional area override supplied by the calling context.
      intent_area_override:
        selector:
          text:
        name: Intent Area Override
        description: Optional area override supplied by the intent context.
      trigger_entity:
        selector:
          entity:
        name: Trigger Entity
        description: Optional entity whose Home Assistant area is used as the fallback.
        default: ''
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ input_area_override | default('''', true) | string | trim != '''' }}'
        sequence:
        - variables:
            target_area: '{{ input_area_override | string | trim }}'
      - conditions:
        - condition: template
          value_template: '{{ intent_area_override | default('''', true) | string | trim != '''' }}'
        sequence:
        - variables:
            target_area: '{{ intent_area_override | string | trim }}'
      default:
      - variables:
          target_area: '{{ area_id(trigger_entity) | default('''', true) }}'
    - variables:
        area_response:
          target_area: '{{ target_area | default('''', true) }}'
    - stop: Area resolved
      response_variable: area_response
    mode: parallel
    max: 10
  astv_resolve_playback_method:
    sequence:
    - variables:
        available_source_names: '{{ available_sources.keys() | list }}'
    - variables:
        matching_sources: "{{\n  preferences\n  | select('in', available_source_names)\n
          \ | list\n}}"
    - variables:
        playback_method_response:
          selected_source: '{{ matching_sources | first }}'
    - stop: Preferred source selected
      response_variable: playback_method_response
    alias: 'ASTV - Fn: Resolve Playback Method'
    description: ''
    fields:
      preferences:
        selector:
          object:
        name: Preferences
      available_sources:
        selector:
          object:
        name: Available Sources
    mode: parallel
    max: 10
  astv_select_area_playback_endpoint:
    alias: 'ASTV - Fn: Select Area Playback Endpoint'
    description: ''
    fields:
      area_playback_domain:
        name: Area Playback Domain
        required: true
        selector:
          object:
      playback_method:
        name: Playback Method
        required: true
        selector:
          text:
    sequence:
    - variables:
        selected_endpoint: '{{ area_playback_domain.get(playback_method, {}) }}'
    - variables:
        area_playback_endpoint_response: '{{ { playback_method: selected_endpoint }
          }}

          '
    - stop: Area playback endpoint selected
      response_variable: area_playback_endpoint_response
    mode: parallel
    max: 10
  astv_ha_mplayer_engine:
    alias: ASTV - HA Media Player Engine
    description: Executes normalized MediaCat/AdvMedia playback through the selected Home Assistant media player.
    mode: parallel
    max: 10
    fields:
      intent_context:
        name: Intent Context
        description: The original intent record and intent-family-specific data.
        required: true
        selector:
          object:
      target_context:
        name: Target Context
        description: The resolved target area and selected endpoint.
        required: true
        selector:
          object:
      execution_context:
        name: Execution Context
        description: The selected ASTV execution engine.
        required: true
        selector:
          object:
    sequence:
    - variables:
        media_player_entity: '{{ target_context.endpoint.media_entity | default('''', true) | string | trim }}'
    - if:
      - condition: template
        value_template: '{{ media_player_entity == '''' }}'
      then:
      - action: persistent_notification.create
        data:
          title: ASTV - HA Media Player Engine
          message: No valid HA Media Player endpoint was supplied for execution method 'ha_mplayer' in area '{{ target_context.area }}'.
      - stop: No valid HA Media Player endpoint supplied
        error: true
    - if:
      - condition: template
        value_template: '{{ intent_context.data.media_record is not defined }}'
      then:
      - action: persistent_notification.create
        data:
          title: ASTV - HA Media Player Engine
          message: media_record is missing from intent_context.data
      - stop: media_record is missing from intent_context.data
        error: true
    - action: script.advmedia_process_media_record
      data:
        media_record: '{{ intent_context.data.media_record }}'
        selected_execution_method: '{{ execution_context.engine }}'
        media_player: '{{ media_player_entity }}'
      response_variable: advmedia_response
    - action: media_player.play_media
      target:
        entity_id: '{{ media_player_entity }}'
      data: '{{ advmedia_response.playback_payload }}'
  astv_g_home_device_engine:
    alias: ASTV - Google Home Device Engine
    description: Executes the selected MediaCat source through a Google Home device
      endpoint.
    mode: parallel
    max: 10
    fields:
      intent_context:
        name: Intent Context
        description: The original intent record and intent-family-specific data.
        required: true
        selector:
          object:
      target_context:
        name: Target Context
        description: The resolved target area and selected endpoint.
        required: true
        selector:
          object:
      execution_context:
        name: Execution Context
        description: The selected ASTV execution engine.
        required: true
        selector:
          object:
    sequence:
    - if:
      - condition: template
        value_template: '{{ intent_context.data.media_record is not defined }}'
      then:
      - action: persistent_notification.create
        data:
          title: ASTV - Google Home Device Engine
          message: media_record is missing from intent_context.data
      - stop: media_record is missing from intent_context.data
        error: true
    - variables:
        source: '{{ intent_context.data.media_record.execution_methods[execution_context.engine].source
          }}'
    - choose:
      - alias: Google Assistant
        conditions:
        - condition: template
          value_template: '{{ source.provider == ''google_assistant'' }}'
        sequence:
        - action: script.astv_provider_g_assist
          data:
            intent: '{{ intent_context.record.intent }}'
            source: '{{ source }}'
            endpoint_phrase: '{{ target_context.endpoint.phrase }}'
          response_variable: provider_response
      default:
      - stop: Unsupported provider for Google Home Device execution
        error: true
    - action: google_assistant_sdk.send_text_command
      data:
        command: '{{ provider_response.command }}'
  astv_provider_g_assist:
    alias: 'ASTV - Provider: Google Assist'
    description: Routes Google Assistant intents to the appropriate generic command
      builder.
    mode: parallel
    max: 10
    fields:
      intent:
        name: Intent
        description: The ASTV intent being executed.
        required: true
        selector:
          text:
      source:
        name: Source
        description: The selected MediaCat source for this execution path.
        required: true
        selector:
          object:
      endpoint_phrase:
        name: Endpoint Phrase
        description: The resolved endpoint phrase, used when required by the selected
          builder.
        required: true
        selector:
          text:
    sequence:
    - variables:
        intent_family: '{{ intent.split(''.'')[0] }}'
    - choose:
      - alias: Media
        conditions:
        - condition: template
          value_template: '{{ intent_family == ''media'' }}'
        sequence:
        - action: script.astv_cmd_builder_media
          data:
            phrase: '{{ source.command }}'
            append_target: '{{ source.append_target }}'
            endpoint_phrase: '{{ endpoint_phrase }}'
          response_variable: command_response
      default:
      - stop: Unsupported intent family for Google Assistant provider
        error: true
    - stop: Google Assistant command built
      response_variable: command_response
  astv_cmd_builder_media:
    alias: 'ASTV - Command Builder: Media'
    description: Builds a media command from the supplied phrase and optional endpoint.
    mode: parallel
    max: 10
    fields:
      phrase:
        name: Phrase
        description: The base media command phrase.
        required: true
        selector:
          text:
      append_target:
        name: Append Target
        description: Whether the endpoint phrase should be appended to the command.
        required: true
        selector:
          boolean:
      endpoint_phrase:
        name: Endpoint Phrase
        description: The endpoint phrase to append when requested.
        required: true
        selector:
          text:
    sequence:
    - if:
      - condition: template
        value_template: '{{ phrase == '''' }}'
      then:
      - stop: Media command phrase is blank
        error: true
    - if:
      - condition: template
        value_template: '{{ append_target and endpoint_phrase == '''' }}'
      then:
      - stop: Media command requires an endpoint phrase
        error: true
    - variables:
        command_response:
          command: "{{ phrase ~ (' on ' ~ endpoint_phrase if append_target else '') }}"
    - stop: Media command built
      response_variable: command_response
  astv_find_routine_trigger:
    alias: 'ASTV - Fn: Find Routine Trigger'
    description: Finds the trigger helper matching a routine and target area.
    mode: parallel
    max: 10
    fields:
      routine:
        name: Routine
        description: The routine ID to resolve.
        required: true
        selector:
          text:
      target_area:
        name: Target Area
        description: The resolved Home Assistant area ID.
        required: true
        selector:
          text:
    sequence:
    - variables:
        routine_label: routine_{{ routine }}
        matching_triggers: "{{\n  area_entities(target_area)\n  | select('in', label_entities(routine_label))\n
          \ | select('in', label_entities('matter_gh_trigger'))\n  | list\n}}"
    - variables:
        trigger_response:
          entity_id: '{{ matching_triggers | first if matching_triggers | count == 1
            else '''' }}'
    - stop: Routine trigger resolved
      response_variable: trigger_response
  astv_g_automation_engine:
    alias: ASTV - Google Automation Engine
    description: Resolves and activates the Google automation trigger for a routine
      and target area.
    mode: parallel
    max: 10
    fields:
      intent_context:
        name: Intent Context
        description: The original intent record and intent-family-specific data.
        required: true
        selector:
          object:
      target_context:
        name: Target Context
        description: The resolved target area and selected endpoint.
        required: true
        selector:
          object:
      execution_context:
        name: Execution Context
        description: The selected ASTV execution engine.
        required: true
        selector:
          object:
    sequence:
    - variables:
        routine: '{{ intent_context.record.routine | default('''', true) | string | trim }}'
        target_area: '{{ target_context.area | default('''', true) | string | trim }}'
    - if:
      - condition: template
        value_template: '{{ routine == '''' }}'
      then:
      - action: persistent_notification.create
        data:
          title: ASTV - Google Automation Engine
          message: No valid routine was supplied for execution method 'g_automation' in area '{{ target_context.area }}'.
      - stop: No valid routine supplied
        error: true
    - if:
      - condition: template
        value_template: '{{ target_area == '''' }}'
      then:
      - action: persistent_notification.create
        data:
          title: ASTV - Google Automation Engine
          message: No valid target area was supplied for execution method 'g_automation' and routine '{{ routine }}'.
      - stop: No valid target area supplied
        error: true
    - action: script.astv_find_routine_trigger
      data:
        routine: '{{ routine }}'
        target_area: '{{ target_area }}'
      response_variable: trigger_response
    - if:
      - condition: template
        value_template: '{{ trigger_response.entity_id | default('''') == '''' }}'
      then:
      - action: notify.persistent_notification
        data:
          title: ASTV - Google Automation Engine
          message: No Google automation trigger was found for routine '{{ routine }}'
            in area '{{ target_area }}'.
      - stop: No routine trigger found
        error: true
    - action: input_boolean.turn_on
      target:
        entity_id: '{{ trigger_response.entity_id }}'
  astv_intent_gateway:
    alias: ASTV - Intent Gateway
    description: Resolves a canonical ASTV intent and target area before routing it.
    mode: parallel
    max: 10
    fields:
      intent_id:
        name: Intent ID
        description: Canonical ASTV intent ID
        required: true
        selector:
          text:
      input_area_override:
        name: Input Area Override
        description: Optional area override supplied by the calling context.
        selector:
          text:
      trigger_entity:
        name: Trigger Entity
        description: Optional entity whose Home Assistant area is used as the fallback.
        selector:
          entity:
    sequence:
    - action: script.astv_find_intent_record
      data:
        intent_id: '{{ intent_id }}'
      response_variable: intent_record_response
    - if:
      - condition: template
        value_template: '{{ intent_record_response | default({}, true) | count == 0
          }}'
      then:
      - action: persistent_notification.create
        data:
          title: No Intent Record Found
          message: 'No record found for intent ID:

            {{ intent_id }}'
      - stop: No intent record found
        error: false
    - action: script.astv_resolve_area
      data:
        input_area_override: '{{ input_area_override | default('''', true) }}'
        intent_area_override: '{{ intent_record_response.area_override | default('''',
          true) }}'
        trigger_entity: '{{ trigger_entity | default('''', true) }}'
      response_variable: area_response
    - variables:
        target_area: '{{ area_response.target_area | default('''', true) | string |
          trim }}'
    - if:
      - condition: template
        value_template: '{{ target_area == '''' }}'
      then:
      - action: persistent_notification.create
        data:
          title: No Target Area Resolved
          message: 'No target area was resolved for intent ID:

            {{ intent_id }}'
      - stop: No target area resolved
        error: false
    - action: script.astv_select_intent_engine
      data:
        intent_record: '{{ intent_record_response }}'
        target_area: '{{ target_area }}'
  astv_select_execution_engine:
    alias: ASTV - Select Execution Engine
    description: Dispatches an ASTV execution request to the selected implemented execution
      engine.
    mode: parallel
    max: 10
    fields:
      intent_context:
        name: Intent Context
        description: The original intent record and intent-family-specific data.
        required: true
        selector:
          object:
      target_context:
        name: Target Context
        description: The resolved target area and selected endpoint.
        required: true
        selector:
          object:
      execution_context:
        name: Execution Context
        description: The selected ASTV execution engine.
        required: true
        selector:
          object:
    sequence:
    - variables:
        execution_engine: '{{ execution_context.engine | default('''', true) | string | trim }}'
    - choose:
      - alias: HA Media Player
        conditions:
        - condition: template
          value_template: '{{ execution_engine == ''ha_mplayer'' }}'
        sequence:
        - action: script.astv_ha_mplayer_engine
          data:
            intent_context: '{{ intent_context }}'
            target_context: '{{ target_context }}'
            execution_context: '{{ execution_context }}'
      - alias: Google Home Device
        conditions:
        - condition: template
          value_template: '{{ execution_engine == ''g_home_device'' }}'
        sequence:
        - action: script.astv_g_home_device_engine
          data:
            intent_context: '{{ intent_context }}'
            target_context: '{{ target_context }}'
            execution_context: '{{ execution_context }}'
      - alias: Google Automation
        conditions:
        - condition: template
          value_template: '{{ execution_engine == ''g_automation'' }}'
        sequence:
        - action: script.astv_g_automation_engine
          data:
            intent_context: '{{ intent_context }}'
            target_context: '{{ target_context }}'
            execution_context: '{{ execution_context }}'
      default:
      - action: persistent_notification.create
        data:
          title: ASTV - Select Execution Engine
          message: Unsupported or blank execution method '{{ execution_engine
            }}' for area '{{ target_context.area }}'.
      - stop: Unsupported or blank execution method
        error: true
  astv_intent_engine_routine:
    alias: 'ASTV - Intent Engine: Routine'
    description: Builds and dispatches the complete execution context for a Routine
      request without resolving the routine trigger.
    mode: parallel
    max: 10
    fields:
      intent_record:
        name: Intent Record
        description: The resolved ASTV intent record.
        required: true
        selector:
          object:
      target_area:
        name: Target Area
        description: The resolved ASTV target area.
        required: true
        selector:
          text:
    sequence:
