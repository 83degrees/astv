name: ASTV-353 disposable administration UI staging

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Separately authorised verification mode
        required: true
        default: read_only
        type: choice
        options:
          - read_only
          - controlled_lifecycle
      human_gate:
        description: Must equal ASTV-353-G2 after explicit human approval
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-private-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASTV_TAG: v0.5.0-beta.603e6e1
      ASTV_SHA: 603e6e160ba90628da09b88aad3ac4ad2fe35759
      ADVNFC_TAG: v1.6.0-beta.dbef2f5
      ADVNFC_SHA: dbef2f5133d2efb6f426b348916dc0c58ec1e147
      HA_IMAGE: ghcr.io/home-assistant/home-assistant:2026.9.4
      BROWSER_IMAGE: mcr.microsoft.com/playwright:v1.56.1-noble
      PLAYWRIGHT_VERSION: 1.56.1
      STAGE_CONTAINER: astv353-home-assistant
      BROWSER_CONTAINER: astv353-browser
      STAGE_NETWORK: astv353-private

    steps:
      - name: Enforce the next human gate
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.human_gate }}" = "ASTV-353-G2"

      - name: Check out governed ASTV candidate and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out immutable AdvNFC provider
        uses: actions/checkout@v4
        with:
          repository: 83degrees/AdvNFC
          ref: v1.6.0-beta.dbef2f5
          path: _advnfc
          fetch-depth: 0

      - name: Assemble synthetic private configuration
        shell: bash
        run: |
          set -euo pipefail
          stage_root="${RUNNER_TEMP}/astv-353-stage"
          config_root="${stage_root}/config"
          evidence_root="${stage_root}/evidence"
          mkdir -p "${config_root}/custom_components" "${evidence_root}" "${stage_root}/packages"
          cp -R 06_Validation/Staging/ASTV-353/config/. "${config_root}/"

          test "$(git rev-list -n 1 "${ASTV_TAG}")" = "${ASTV_SHA}"
          test "$(git -C _advnfc rev-parse HEAD)" = "${ADVNFC_SHA}"
          git archive "${ASTV_TAG}" custom_components/astv_intent_catalogue | tar -x -C "${config_root}"
          git -C _advnfc archive HEAD custom_components/advnfc | tar -x -C "${config_root}"

          git rev-parse "${ASTV_TAG}:custom_components/astv_intent_catalogue" > "${evidence_root}/astv-tree.txt"
          git -C _advnfc rev-parse 'HEAD:custom_components/advnfc' > "${evidence_root}/advnfc-tree.txt"
          printf '%s\n' "${ASTV_SHA}" > "${evidence_root}/astv-tag-sha.txt"
          printf '%s\n' "${ADVNFC_SHA}" > "${evidence_root}/advnfc-tag-sha.txt"
          find "${config_root}" -type f -print0 | sort -z | xargs -0 sha256sum > "${evidence_root}/config-before.sha256"

          npm pack "playwright-core@${PLAYWRIGHT_VERSION}" --pack-destination "${stage_root}/packages"
          npm pack "playwright@${PLAYWRIGHT_VERSION}" --pack-destination "${stage_root}/packages"
          npm pack "@playwright/test@${PLAYWRIGHT_VERSION}" --pack-destination "${stage_root}/packages"
          sha256sum "${stage_root}"/packages/*.tgz > "${evidence_root}/browser-packages.sha256"
          printf '%s\n' "${stage_root}" > "${RUNNER_TEMP}/astv353-stage-root.txt"

      - name: Pull and record exact runtime image identities
        shell: bash
        run: |
          set -euo pipefail
          stage_root="$(cat "${RUNNER_TEMP}/astv353-stage-root.txt")"
          docker pull "${HA_IMAGE}"
          docker pull "${BROWSER_IMAGE}"
          docker image inspect "${HA_IMAGE}" --format '{{json .RepoDigests}}' > "${stage_root}/evidence/ha-image-repodigests.json"
          docker image inspect "${BROWSER_IMAGE}" --format '{{json .RepoDigests}}' > "${stage_root}/evidence/browser-image-repodigests.json"
          jq -e 'length > 0' "${stage_root}/evidence/ha-image-repodigests.json" >/dev/null
          jq -e 'length > 0' "${stage_root}/evidence/browser-image-repodigests.json" >/dev/null

      - name: Start internal-only Home Assistant stage
        shell: bash
        run: |
          set -euo pipefail
          stage_root="$(cat "${RUNNER_TEMP}/astv353-stage-root.txt")"
          docker network create --internal "${STAGE_NETWORK}" >/dev/null
          docker run --detach \
            --name "${STAGE_CONTAINER}" \
            --hostname home-assistant \
            --network "${STAGE_NETWORK}" \
            --network-alias home-assistant \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --tmpfs /run:rw,nosuid,size=64m \
            --volume "${stage_root}/config:/config:rw" \
            --entrypoint python3 \
            "${HA_IMAGE}" -m homeassistant --config /config

          for attempt in $(seq 1 120); do
            docker exec "${STAGE_CONTAINER}" python3 -c "import socket; s=socket.create_connection(('127.0.0.1',8123),2); s.close()" 2>/dev/null && break
            docker inspect "${STAGE_CONTAINER}" --format '{{.State.Running}}' | grep -qx true
            sleep 2
          done
          docker inspect "${STAGE_CONTAINER}" --format \
            '{"network_mode":"{{.HostConfig.NetworkMode}}","published_ports":{{json .HostConfig.PortBindings}},"cap_drop":{{json .HostConfig.CapDrop}},"security_opt":{{json .HostConfig.SecurityOpt}}}' \
            > "${stage_root}/evidence/ha-isolation.json"
          docker network inspect "${STAGE_NETWORK}" --format '{"internal":{{.Internal}},"containers":{{json .Containers}}}' > "${stage_root}/evidence/network-isolation.json"
          jq -e '.internal == true' "${stage_root}/evidence/network-isolation.json" >/dev/null
          jq -e '.published_ports == null' "${stage_root}/evidence/ha-isolation.json" >/dev/null

      - name: Bootstrap identities and synthetic fixtures
        shell: bash
        run: |
          set -euo pipefail
          stage_root="$(cat "${RUNNER_TEMP}/astv353-stage-root.txt")"
          docker exec "${STAGE_CONTAINER}" python3 /config/staging/prepare_stage.py
          sudo cp "${stage_root}/config/staging/stage-evidence.json" "${stage_root}/evidence/stage-evidence.json"

      - name: Run desktop, mobile, and permission browser checks
        shell: bash
        run: |
          set -euo pipefail
          stage_root="$(cat "${RUNNER_TEMP}/astv353-stage-root.txt")"
          docker run --rm \
            --name "${BROWSER_CONTAINER}" \
            --network "${STAGE_NETWORK}" \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume "${stage_root}/config:/stage:ro" \
            --volume "${stage_root}/evidence:/evidence:rw" \
            --volume "${PWD}/06_Validation/Staging/ASTV-353/browser:/work:ro" \
            --volume "${stage_root}/packages:/packages:ro" \
            --env ASTV353_MODE="${{ inputs.mode }}" \
            --env PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            --entrypoint bash \
            "${BROWSER_IMAGE}" -lc \
            'set -euo pipefail; mkdir /tmp/pw; cd /tmp/pw; npm init -y >/dev/null; npm install --offline --ignore-scripts /packages/playwright-core-*.tgz /packages/playwright-[0-9]*.tgz /packages/playwright-test-*.tgz >/dev/null; cp /work/*.mjs .; npx playwright test --config playwright.config.mjs browser.spec.mjs'

      - name: Execute separately authorised synthetic lifecycle
        if: inputs.mode == 'controlled_lifecycle'
        shell: bash
        run: |
          set -euo pipefail
          docker exec "${STAGE_CONTAINER}" python3 /config/staging/lifecycle.py
          docker restart "${STAGE_CONTAINER}" >/dev/null
          for attempt in $(seq 1 120); do
            docker exec "${STAGE_CONTAINER}" python3 -c "import socket; s=socket.create_connection(('127.0.0.1',8123),2); s.close()" 2>/dev/null && break
            sleep 2
          done
          docker exec "${STAGE_CONTAINER}" python3 /config/staging/verify_restoration.py

      - name: Verify fixture restoration and segregation
        shell: bash
        run: |
          set -euo pipefail
          stage_root="$(cat "${RUNNER_TEMP}/astv353-stage-root.txt")"
          before_catalogue="$(grep '/astv/astv_intent_catalogue.yaml$' "${stage_root}/evidence/config-before.sha256" | cut -d' ' -f1)"
          before_mapping="$(grep '/AdvNFC/advnfc_tag_mapping.yaml$' "${stage_root}/evidence/config-before.sha256" | cut -d' ' -f1)"
          test "${before_catalogue}" = "$(sudo sha256sum "${stage_root}/config/astv/astv_intent_catalogue.yaml" | cut -d' ' -f1)"
          test "${before_mapping}" = "$(sudo sha256sum "${stage_root}/config/AdvNFC/advnfc_tag_mapping.yaml" | cut -d' ' -f1)"
          ! sudo grep -R -E -i '(ha-starburst|assistive/nfc|mqtt:|password:|api_key:|bearer )' "${stage_root}/config" --exclude='browser-session.json'
          sudo rm -f "${stage_root}/config/staging/browser-session.json"

      - name: Capture logs and dispose all staging resources
        if: always()
        shell: bash
        run: |
          stage_root="$(cat "${RUNNER_TEMP}/astv353-stage-root.txt" 2>/dev/null || true)"
          if test -n "${stage_root}" && test -d "${stage_root}"; then
            docker logs "${STAGE_CONTAINER}" > "${stage_root}/evidence/home-assistant.log" 2>&1 || true
            for name in stage-evidence.json lifecycle-evidence.json; do
              sudo test -f "${stage_root}/config/staging/${name}" && sudo cp "${stage_root}/config/staging/${name}" "${stage_root}/evidence/${name}" || true
            done
            sudo rm -f "${stage_root}/config/staging/browser-session.json"
            sudo chown -R "$(id -u):$(id -g)" "${stage_root}/evidence" || true
          fi
          docker rm --force "${BROWSER_CONTAINER}" "${STAGE_CONTAINER}" >/dev/null 2>&1 || true
          docker network rm "${STAGE_NETWORK}" >/dev/null 2>&1 || true
          ! docker ps --all --format '{{.Names}}' | grep -Eq '^astv353-(home-assistant|browser)$'
          ! docker network ls --format '{{.Name}}' | grep -qx "${STAGE_NETWORK}"
          if test -n "${stage_root}" && test -d "${stage_root}"; then
            printf '%s\n' 'containers_removed=true' 'network_removed=true' > "${stage_root}/evidence/disposal.txt"
          fi

      - name: Upload immutable staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astv-353-disposable-staging-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/astv-353-stage/evidence
          if-no-files-found: error
          retention-days: 30
